services:
  pulse:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/pulse.db
    ports:
      - "3000:3000" # page, API and live WebSocket all on one port
    volumes:
      - pulse-data:/app/data
    restart: unless-stopped

volumes:
  pulse-data:
