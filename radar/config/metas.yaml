# Memecoin metas: the recurring themes coins launch and rotate around.
# Radar matches every tracked coin (name/symbol), every social post and every headline against these keywords,
# then ranks the metas by live heat (mentions, launches, volume, price). Edit freely; restart to apply.
#
#   keywords: matched as whole words in text and coin names, and as a prefix/suffix of coin symbols (POPCAT -> cat)
#   tickers:  exact symbols of the meta's known leaders
#   phrases:  matched anywhere in text only (multi-word or non-Latin)
families:
  animals: Animals
  ai: AI
  politics: Politics
  people: People & celebs
  culture: Internet culture
  topics: Topics
  chains: Chains & launchpads
  catalysts: Catalysts & news

