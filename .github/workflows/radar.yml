name: Memecoin Radar
on:
  push:
    paths: ["radar/**", ".github/workflows/radar.yml"]
  pull_request:
    paths: ["radar/**", ".github/workflows/radar.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: radar/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: radar/backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: radar/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: radar/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t memecoin-radar radar
      - name: Smoke test the image
        run: |
          docker run -d --name radar -e RADAR_PASSWORD=ci-secret -e RADAR_DISABLE_INGEST=1 -p 8000:8000 memecoin-radar
          for i in $(seq 1 30); do curl -fs localhost:8000/api/healthz && break; sleep 1; done
          curl -fs localhost:8000/api/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/connectors)" = 401
          curl -fs localhost:8000/ | grep -q "Memecoin Radar"
